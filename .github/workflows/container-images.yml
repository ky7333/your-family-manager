name: Container Images

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            context: .
            file: ./web/Dockerfile
            image: ghcr.io/${{ github.repository }}-web
          - name: backend
            context: ./server
            file: ./server/src/main/docker/Dockerfile.jvm
            image: ghcr.io/${{ github.repository }}-server
            prebuild: ./mvnw -DskipTests package
            prebuild_workdir: ./server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        if: matrix.prebuild
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Maven wrapper is executable
        if: matrix.prebuild
        working-directory: ${{ matrix.prebuild_workdir }}
        run: chmod +x mvnw

      - name: Build backend artifact
        if: matrix.prebuild
        working-directory: ${{ matrix.prebuild_workdir }}
        run: ${{ matrix.prebuild }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
