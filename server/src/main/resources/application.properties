# Hibernate settings
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=true

# Optional: show SQL parameters in logs (useful for debugging)
quarkus.hibernate-orm.log.bind-parameters=true

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS

# Form-based authentication
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.http-only-cookie=true
# Extend auth session lifetime for web/mobile MVP usability.
quarkus.http.auth.form.timeout=7D
quarkus.http.auth.form.new-cookie-interval=1H
quarkus.http.auth.form.cookie-max-age=7D
# Keep form-auth cookie encryption stable across restarts.
quarkus.http.auth.session.encryption-key=${YFM_SESSION_ENCRYPTION_KEY}
%dev.quarkus.http.auth.session.encryption-key=${YFM_SESSION_ENCRYPTION_KEY:dev-only-change-this-session-key}
%test.quarkus.http.auth.session.encryption-key=${YFM_SESSION_ENCRYPTION_KEY:dev-only-change-this-session-key}
#quarkus.http.auth.permission.authenticated.paths=/*
#quarkus.http.auth.permission.authenticated.policy=authenticated

# Liquibase configuration
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

# Default datasource kind; enables Dev Services DB provisioning in dev
quarkus.datasource.db-kind=postgresql

# Dev profile: let Quarkus Dev Services auto-start a PostgreSQL DB
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.compose.devservices.enabled=false

# Test profile: in-memory DB so tests don't require Docker
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:yfm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.compose.devservices.enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=none
